services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: student_grading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/student_grading
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_REDIS_HOST: redis
      JWT_SECRET_KEY: c3R1ZGVudGdyYWRpbmdzeXN0ZW1qd3RzZWNyZXRrZXlmb3Jkb2NrZXI=
      JWT_EXPIRATION_MS: "86400000"
      JWT_REFRESH_EXPIRATION_MS: "604800000"
      FIREBASE_ENABLED: "false"
      APP_FRONTEND_RESET_PASSWORD_URL: http://localhost:3000/reset-password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
